// key_panel —— NeoForge 1.21.1 (21.1.251)
// 纯客户端模组，1.21.1 版默认基于 libs/ 下的依赖 jar 编译；备选 ModDevGradle 构建见 build-moddev.gradle。

plugins {
    id 'java'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    // 本地 libs/ 已包含全部编译期依赖；这里只是给可选的在线解析留后路
    maven { name = 'NeoForgedMirror'; url = 'https://bmclapi2.bangbang93.com/maven/' }
    maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
}

dependencies {
    compileOnly fileTree(dir: 'libs', include: ['**/*.jar'])
}

// neoforge.mods.toml 里的 ${mod_version} 等占位符替换
tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_group_id           : mod_group_id,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : mod_name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
    options.compilerArgs << '-proc:none'   // libs/ 里的 jar 带注解处理器，关掉避免噪音
}

tasks.named('build') {
    dependsOn 'jar'
}
